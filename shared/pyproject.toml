[project]
name = "smart-campus-protocol"
version = "2.0.0"
description = "Shared contracts of the MEU reception robot: robot <-> backend messages (protocol version 2), Pi <-> ESP32 serial frames, odometry maths"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scr_protocol*", "scr_serial*", "scr_odometry*"]

[tool.setuptools.package-data]
scr_protocol = ["py.typed"]
