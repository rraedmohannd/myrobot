[project]
name = "smart-campus-backend"
version = "0.1.0"
description = "Backend for the MEU Faculty of Engineering reception robot (Graduation Project 2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "httpx>=0.27,<1.0",
    "openai>=1.60,<3.0",
    "numpy>=1.26,<3",
    "sherpa-onnx>=1.10,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# pgvector columns cannot be reflected by SQLAlchemy; app.db.types.alembic_compare_type handles it
filterwarnings = [
    "ignore:Did not recognize type 'vector':sqlalchemy.exc.SAWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
