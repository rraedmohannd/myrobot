<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة الروبوت — Robot screen</title>
<!-- The robot's screen in a browser: stands in for the 7" HDMI display (1024x600) until the
     hardware exists. Same /ws/robot protocol as /voice (static/robot-client.js). Everything is
     local: no CDN, no web fonts, so the page keeps working after the first load. -->
<style>
  :root { --bg:#0d1820; --panel:#142430; --ink:#f3f6f8; --muted:#9db0bd; --line:#24394a; --brand:#931b1f; --eye:#8fe9ff; --mouth-in:#4a0d12; --ok:#3ecf7a; --warn:#ffb648; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:#05090c; overflow:hidden; }
  body { font-family:"Segoe UI", Tahoma, "Noto Sans Arabic", "Noto Naskh Arabic", "DejaVu Sans", sans-serif; color:var(--ink); }
  #stage { position:absolute; left:0; top:0; width:1024px; height:600px; background:var(--bg); transform-origin:0 0; display:grid; grid-template-rows:44px 1fr; overflow:hidden; }

  /* ---------- top bar ---------- */
  #bar { display:flex; align-items:center; gap:12px; padding:0 14px; background:var(--brand); font-size:17px; }
  #bar .name { font-weight:600; }
  #bar .spacer { flex:1; }
  .chip { font-size:13px; padding:2px 10px; border-radius:999px; background:rgba(255,255,255,.16); white-space:nowrap; }
  #conn { display:flex; align-items:center; gap:6px; font-size:13px; }
  #conn i { width:10px; height:10px; border-radius:50%; background:var(--warn); display:inline-block; }
  #conn.ok i { background:var(--ok); }

  /* ---------- layout ---------- */
  #main { display:grid; grid-template-columns:1fr 372px; direction:ltr; min-height:0; }
  #facePanel { display:flex; align-items:center; justify-content:center; position:relative; border-left:1px solid var(--line); }
  #leftCol { position:relative; min-width:0; min-height:0; display:flex; }
  #leftCol > #textPanel { flex:1; }
  #textPanel { direction:rtl; display:flex; flex-direction:column; padding:14px 22px 12px; min-width:0; min-height:0; position:relative; }
  #meta { display:flex; align-items:center; gap:10px; min-height:30px; }
  #speaker { background:var(--eye); color:#06222b; font-weight:700; font-size:16px; padding:2px 14px; border-radius:999px; }
  #heard { color:var(--muted); font-size:16px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; flex:1; }
  #subtitle { flex:1; display:flex; flex-direction:column; justify-content:center; font-weight:600; line-height:1.55; font-size:40px; min-height:0; overflow:hidden; }
  #subtitle.m { font-size:32px; } #subtitle.s { font-size:25px; }
  #subtitle small { display:block; font-size:19px; font-weight:400; color:var(--muted); margin-top:8px; }
  #hint { min-height:26px; color:var(--eye); font-size:18px; }

  /* ---------- card ---------- */
  #card { display:none; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 14px; margin-top:8px; align-items:center; }
  #card.on { display:flex; }
  #cardMedia { flex:0 0 244px; height:159px; border-radius:10px; overflow:hidden; background:#000; display:none; }
  #cardMedia.on { display:block; }
  #cardMedia img, #cardMedia video { width:100%; height:100%; object-fit:cover; display:block; }
  #cardText { flex:1; min-width:0; }
  #cardTitle { font-size:19px; font-weight:700; color:var(--eye); margin-bottom:2px; }
  #cardLines { margin:0; padding:0; list-style:none; font-size:16px; line-height:1.5; }
  #cardLines li { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #cardSource { font-size:12px; color:var(--muted); margin-top:4px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }

  /* ---------- start + text fallback ---------- */
  #start { align-self:center; font:inherit; font-size:30px; font-weight:700; color:#fff; background:var(--brand); border:0; border-radius:18px; padding:16px 44px; cursor:pointer; box-shadow:0 6px 0 #5d1013; margin:6px 0 4px; }
  #start:active { transform:translateY(3px); box-shadow:0 3px 0 #5d1013; }
  #start small { display:block; font-size:15px; font-weight:400; opacity:.85; }
  #start[hidden] { display:none; }
  #typedRow { display:none; gap:8px; margin-top:8px; }
  #typedRow.on { display:flex; }
  #typed { flex:1; font:inherit; font-size:18px; padding:8px 12px; border-radius:10px; border:1px solid var(--line); background:#0a141b; color:var(--ink); }
  #typedRow button { font:inherit; font-size:16px; border:0; border-radius:10px; padding:0 18px; background:var(--eye); color:#06222b; cursor:pointer; }
  #keys { position:absolute; right:12px; top:50px; direction:ltr; font-size:11px; color:#5d7383; }

  /* ---------- explainer: "the robot presents the program" (sprint 2) ---------- */
  #scenePanel { position:absolute; inset:0; background:var(--bg); display:none; flex-direction:column; padding:8px 16px 10px; direction:rtl; z-index:3; }
  #scenePanel.on { display:flex; }
  #sceneHead { display:flex; align-items:center; gap:10px; min-height:30px; }
  #sceneProgram { font-size:17px; font-weight:700; color:var(--eye); flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  #sceneDots { display:flex; gap:6px; direction:ltr; }
  #sceneDots i { width:22px; height:6px; border-radius:3px; background:var(--line); }
  #sceneDots i.done { background:var(--muted); } #sceneDots i.now { background:var(--eye); }
  #sceneBox { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  #sceneBox .xs { flex:none; }
  #sceneCaption { height:54px; font-size:18px; line-height:27px; color:var(--muted); overflow:hidden; text-align:center; font-weight:400; }
  #sceneButtons { display:flex; gap:10px; justify-content:center; margin-top:4px; min-height:46px; }
  .tap { font:inherit; font-size:19px; font-weight:700; color:var(--ink); background:var(--panel); border:2px solid var(--line); border-radius:14px; padding:8px 22px; cursor:pointer; min-height:46px; }
  .tap:active { transform:translateY(2px); }
  .tap.main { background:var(--brand); border-color:var(--brand); color:#fff; }
  .tap small { font-size:13px; font-weight:400; opacity:.8; margin-inline-start:6px; }
  #scenePanel [hidden] { display:none; }

  /* ---------- idle screen: attract mode + touch buttons ---------- */
  #attract { display:none; height:250px; flex:none; align-items:center; gap:6px; direction:rtl; }
  #attract.on { display:flex; }
  #attractBox { width:372px; height:250px; flex:none; position:relative; overflow:hidden; }
  #attractBox .xs { position:absolute; left:0; top:0; transform:scale(.6); transform-origin:0 0; }
  #attractName { position:absolute; left:0; right:0; top:8px; text-align:center; font-size:20px; font-weight:700; color:var(--eye); z-index:1; }
  #attractSide { flex:1; min-width:0; text-align:center; }
  #attractSide b { display:block; font-size:34px; line-height:1.35; }
  #attractSide span { display:block; font-size:15px; color:var(--muted); margin-top:6px; }
  body.attract #subtitle { display:none; }
  body.attract #start { font-size:24px; padding:8px 34px; margin:2px 0 2px; }
  body.attract #hint { display:none; }
  #chips { display:none; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px; }
  #chips.on { display:flex; }
  #chips .label { flex-basis:100%; text-align:center; font-size:14px; color:var(--muted); }
  #chips .tap { font-size:16px; padding:5px 14px; min-height:38px; border-radius:999px; }
  /* ---------- interest matching: options and suggested programs ---------- */
  #choices { display:none; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  #choices.on { display:grid; }
  #choices .tap { font-size:20px; padding:10px 8px; min-height:56px; }
  #choices .tap.wide { grid-column:1 / -1; }
  #choices .tap span { display:block; font-size:14px; font-weight:400; color:var(--muted); }
  #choices .tap.main span { color:#fff; opacity:.85; }
  #choices .tap:disabled { opacity:.75; cursor:default; }
  body.choosing #subtitle { flex:0 0 auto; font-size:27px; min-height:86px; }
  body.choosing #card { display:none; }

  /* ---------- face ---------- */
  #face { width:340px; height:340px; --eye:#8fe9ff; transition:filter .4s; }
  #face .float { animation:float 5s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  #face .eyeMode, #face .lid, #face .brow, #face .pupils { transform-box:fill-box; transform-origin:center; transition:transform .35s, opacity .25s; }
  #face .lid { animation:blink 4.6s infinite; }
  #face .eyeR .lid { animation-delay:.04s; }
  @keyframes blink { 0%,93%,100% { transform:scaleY(1); } 96% { transform:scaleY(.06); } }
  #face .eyeHappy, #face .eyeFlat, #face .waves, #face .dots, #face .warnIcon { opacity:0; transition:opacity .25s; }
  #face .cheek { opacity:.0; transition:opacity .4s; }

  #face[data-mode="attentive"] .eyeMode { transform:scale(1.1); }
  #face[data-mode="attentive"] .brow { transform:translateY(-10px); }
  #face[data-mode="attentive"] .cheek { opacity:.35; }
  #face[data-mode="listening"] .eyeMode { transform:scale(1.06); }
  #face[data-mode="listening"] .waves { opacity:1; }
  #face[data-mode="listening"] .waves path { animation:wave 1.3s ease-in-out infinite; }
  #face[data-mode="listening"] .waves path:nth-child(2n) { animation-delay:.25s; }
  @keyframes wave { 0%,100% { opacity:.2; } 50% { opacity:1; } }
  #face[data-mode="processing"] .pupils { transform:translate(10px,-16px); }
  #face[data-mode="processing"] .brow { transform:translateY(-6px) rotate(-4deg); }
  #face[data-mode="processing"] .dots { opacity:1; }
  #face[data-mode="processing"] .dots circle { animation:dot 1s ease-in-out infinite; }
  #face[data-mode="processing"] .dots circle:nth-child(2) { animation-delay:.15s; }
  #face[data-mode="processing"] .dots circle:nth-child(3) { animation-delay:.3s; }
  @keyframes dot { 0%,100% { transform:translateY(0); opacity:.4; } 50% { transform:translateY(-10px); opacity:1; } }
  #face[data-mode="answering"] .cheek { opacity:.25; }
  #face[data-mode="finished"] .eyeOpen { opacity:0; }
  #face[data-mode="finished"] .eyeHappy { opacity:1; }
  #face[data-mode="finished"] .cheek { opacity:.5; }
  #face[data-mode="unavailable"] { --eye:#8493a0; }
  #face[data-mode="unavailable"] .eyeOpen { opacity:0; }
  #face[data-mode="unavailable"] .eyeFlat, #face[data-mode="unavailable"] .warnIcon { opacity:1; }
  #face[data-mode="unavailable"] .float { animation:none; }
  @media (prefers-reduced-motion: reduce) { #face .float, #face .lid { animation:none; } }

  /* ---------- camera preview (M7) ---------- */
  #cam { position:absolute; right:10px; bottom:10px; width:152px; height:114px; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:#000; display:none; }
  #cam.on { display:block; }
  #cam video, #cam canvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #cam video { transform:scaleX(-1); }   /* mirror view; the boxes are drawn already mirrored */
  #camNote { position:absolute; left:10px; bottom:10px; font-size:11px; color:#5d7383; direction:rtl; max-width:190px; }
</style>
</head>
<body>
<div id="stage">
  <div id="bar">
    <span class="name">كلية الهندسة والتصميم — جامعة الشرق الأوسط</span>
    <span class="spacer"></span>
    <span class="chip" title="This browser page stands in for the robot's 7-inch HDMI screen (1024×600)">محاكاة لشاشة الروبوت · Robot screen simulation</span>
    <span id="conn"><i></i><span id="connText">جاري الاتصال…</span></span>
  </div>
  <div id="main">
    <div id="leftCol">
    <div id="textPanel">
      <div id="meta"><span id="speaker" hidden></span><span id="heard" dir="auto"></span></div>
      <div id="attract"><div id="attractBox"><div id="attractName" dir="auto"></div><div id="attractScene"></div></div><div id="attractSide"><b>قرّب واحكي معي 👋</b><span>Come closer and talk to me</span></div></div>
      <div id="subtitle" dir="auto"></div>
      <button id="start" hidden>ابدأ المحادثة<small>Start · أو اضغط مسافة (Space)</small></button>
      <div id="chips"></div>
      <div id="choices"></div>
      <div id="hint"></div>
      <div id="card">
        <div id="cardMedia"></div>
        <div id="cardText">
          <div id="cardTitle" dir="auto"></div>
          <ul id="cardLines" dir="auto"></ul>
          <div id="cardSource" dir="auto"></div>
        </div>
      </div>
      <div id="typedRow"><input id="typed" type="text" dir="auto" placeholder="اكتب سؤالك هون… Type your question"><button id="typedSend">إرسال</button></div>
    </div>
    <div id="scenePanel">
      <div id="sceneHead"><span id="sceneProgram" dir="auto"></span><span id="sceneDots"></span></div>
      <div id="sceneBox"></div>
      <div id="sceneCaption" dir="auto"></div>
      <div id="sceneButtons">
        <button class="tap" id="xSkip">التالي ⏭<small>Next</small></button>
        <button class="tap" id="xStop">إيقاف ⏹<small>Stop</small></button>
        <button class="tap main" id="xMore" hidden>كمّل ▶<small>Continue</small></button>
        <button class="tap" id="xAsk" hidden>عندي سؤال<small>I have a question</small></button>
      </div>
    </div>
    </div>
    <div id="facePanel">
      <svg id="face" data-mode="idle" viewBox="0 0 400 400" role="img" aria-label="وجه الروبوت">
        <g class="float">
          <g class="dots" fill="var(--eye)"><circle cx="170" cy="52" r="9"/><circle cx="200" cy="52" r="9"/><circle cx="230" cy="52" r="9"/></g>
          <g class="warnIcon"><path d="M200 22 L232 78 H168 Z" fill="none" stroke="#ffb648" stroke-width="7" stroke-linejoin="round"/><path d="M200 42 V60 M200 68 V70" stroke="#ffb648" stroke-width="7" stroke-linecap="round"/></g>
          <g class="waves" fill="none" stroke="var(--eye)" stroke-width="7" stroke-linecap="round">
            <path d="M44 150 Q28 190 44 230"/><path d="M356 150 Q372 190 356 230"/>
            <path d="M22 130 Q-2 190 22 250"/><path d="M378 130 Q402 190 378 250"/>
          </g>
          <g class="brow" stroke="var(--eye)" stroke-width="9" stroke-linecap="round" fill="none">
            <path d="M92 96 Q128 80 164 96"/><path d="M236 96 Q272 80 308 96"/>
          </g>
          <g class="eyeL"><g class="eyeMode">
            <g class="eyeOpen"><g class="lid"><rect x="94" y="118" width="70" height="96" rx="35" fill="var(--eye)"/><g class="pupils"><circle cx="129" cy="166" r="20" fill="#06222b"/><circle cx="137" cy="156" r="7" fill="#fff"/></g></g></g>
            <path class="eyeHappy" d="M94 176 Q129 128 164 176" fill="none" stroke="var(--eye)" stroke-width="13" stroke-linecap="round"/>
            <path class="eyeFlat" d="M98 168 H160" stroke="var(--eye)" stroke-width="13" stroke-linecap="round"/>
          </g></g>
          <g class="eyeR"><g class="eyeMode">
            <g class="eyeOpen"><g class="lid"><rect x="236" y="118" width="70" height="96" rx="35" fill="var(--eye)"/><g class="pupils"><circle cx="271" cy="166" r="20" fill="#06222b"/><circle cx="279" cy="156" r="7" fill="#fff"/></g></g></g>
            <path class="eyeHappy" d="M236 176 Q271 128 306 176" fill="none" stroke="var(--eye)" stroke-width="13" stroke-linecap="round"/>
            <path class="eyeFlat" d="M240 168 H302" stroke="var(--eye)" stroke-width="13" stroke-linecap="round"/>
          </g></g>
          <circle class="cheek" cx="84" cy="246" r="22" fill="#ff7a8a"/><circle class="cheek" cx="316" cy="246" r="22" fill="#ff7a8a"/>
          <path id="mouth" d="M154 290 Q200 322 246 290 Q200 322 154 290 Z" fill="var(--mouth-in)" stroke="var(--eye)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
      </svg>
      <div id="cam"><video id="camVideo" playsinline muted></video><canvas id="camCanvas" width="304" height="228"></canvas></div>
      <div id="camNote"></div>
    </div>
  </div>
  <div id="keys">Space: start · T: type · C: camera · Esc: end · F: fullscreen</div>
</div>

<script src="/static/robot-client.js"></script>
<script src="/static/speaker-camera.js"></script>
<script src="/static/vendor/qrcode/qrcode.js"></script>
<script src="/static/explainer-scenes.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const TEXT = {
  idle: ["أهلاً وسهلاً! أنا روبوت الكلية.", "اكبس «ابدأ المحادثة» واسألني عن تخصصاتنا · Press Start and ask me about our programs"],
  unavailable: ["عذراً، الخدمة مش متاحة هلأ.", "بحاول أتصل من جديد… · Service unavailable — reconnecting"],
  hints: { speak: "تفضّل احكي، أنا سامعك… · Speak now", hearing: "عم بسمعك… · Listening", thinking: "لحظة، عم بفكّر… · Thinking", robot: "", "": "" },
  mic: "المايك مش شغّال — اضغط T واكتب سؤالك · Microphone unavailable: press T and type",
};
// Mouth shape per display mode: half-width, smile depth, opening (0..1). Speech adds to `open`.
const MOUTH = {
  idle: {w: 44, smile: 14, open: 0}, attentive: {w: 56, smile: 22, open: .14}, listening: {w: 24, smile: 4, open: .22},
  processing: {w: 28, smile: 0, open: 0}, answering: {w: 48, smile: 10, open: .05}, finished: {w: 62, smile: 28, open: .2},
  unavailable: {w: 40, smile: -12, open: 0},
};

let serverMode = "idle", playingTag = null, connected = false, inSession = false, micOk = true, hearing = false;
let subtitleTimer = null;
const params = new URLSearchParams(location.search);
const client = new RobotClient({
  robotId: "robot-screen-browser", fwVersion: "robot-page-1", autoReconnect: true,
  token: params.get("token"), tagAudio: () => serverMode,
  audioEndExtra: () => (window.speakerCamera ? window.speakerCamera.audioEndFields() : {}),
});

// ---------- camera: who is speaking (docs/SPEAKERS.md) ----------
// Off by default. Turn it on with the C key or /robot?camera=1. Options:
//   ?face_start=1[&face_start_ms=1500]  a face looking at the camera starts the conversation
//   ?mouth_thr=0.025                    mouth-activity threshold (calibrate with real people)
// Frames never leave the browser: only face_track_id and overlap go out with audio.end.
let cameraWanted = params.get("camera") === "1" || params.get("face_start") === "1";
const camera = new SpeakerCamera({
  client, video: $("camVideo"), canvas: $("camCanvas"), box: $("cam"),
  activityMin: parseFloat(params.get("mouth_thr")) || 0.025,
  faceStart: params.get("face_start") === "1", faceStartMs: parseInt(params.get("face_start_ms"), 10) || 1500,
  // Browsers only allow sound after the visitor touched the page once; before that the button is needed.
  onFaceStart: () => { if (!navigator.userActivation || navigator.userActivation.hasBeenActive) start(); },
  onStatus: text => { $("camNote").textContent = text; },
});
window.speakerCamera = camera;

// ---------- rendering ----------
function fit() {
  const s = Math.min(innerWidth / 1024, innerHeight / 600);
  const stage = $("stage");
  stage.style.transform = `translate(${(innerWidth - 1024 * s) / 2}px, ${(innerHeight - 600 * s) / 2}px) scale(${s})`;
}
addEventListener("resize", fit); fit();

function currentMode() {
  if (!connected) return "unavailable";
  if (client.playing && playingTag) return ["listening", "processing", "idle"].includes(playingTag) ? "answering" : playingTag;
  if (hearing) return "listening";
  return serverMode;
}
function render() {
  const mode = currentMode();
  $("face").dataset.mode = mode;
  const idleScreen = connected && !inSession && !client.playing && client.queue.length === 0;
  $("start").hidden = !idleScreen;
  setIdleExtras(idleScreen);
  if (!connected && xp) exitExplainer();
  if (!connected || idleScreen) setChoices(null);
  if (!connected) { setSubtitle(TEXT.unavailable[0], TEXT.unavailable[1]); setCard(null); $("speaker").hidden = true; $("heard").textContent = ""; $("hint").textContent = ""; }
  else if (idleScreen) { setSubtitle(TEXT.idle[0], TEXT.idle[1]); setCard(null); $("speaker").hidden = true; $("heard").textContent = ""; $("hint").textContent = ""; }
}
function setSubtitle(text, small) {
  const el = $("subtitle");
  el.textContent = text || "";
  el.className = (text || "").length > 150 ? "s" : (text || "").length > 70 ? "m" : "";
  if (small) { const s = document.createElement("small"); s.textContent = small; el.appendChild(s); }
}
function setCard(card) {
  const on = !!(card && (card.title || (card.lines || []).length));
  $("card").classList.toggle("on", on);
  const mediaBox = $("cardMedia");
  if (!on) { mediaBox.classList.remove("on"); mediaBox.replaceChildren(); return; }
  $("cardTitle").textContent = card.title || "";
  $("cardLines").replaceChildren(...(card.lines || []).slice(0, 3).map(t => { const li = document.createElement("li"); li.textContent = t; return li; }));
  const sources = card.sources || [];
  $("cardSource").textContent = sources.length ? "المصدر · Source: " + sources.join(" · ") : "";
  // Optional picture or video next to the text (docs/PROTOCOL.md `card.media`). Video is always
  // muted and looping, so the robot's voice stays clear and the microphone does not hear it.
  const media = card.media;
  mediaBox.replaceChildren();
  mediaBox.classList.toggle("on", !!media);
  if (media) {
    const el = document.createElement(media.kind === "video" ? "video" : "img");
    el.src = media.url;
    if (media.kind === "video") { el.muted = true; el.loop = true; el.autoplay = true; el.playsInline = true; el.setAttribute("aria-label", media.alt || ""); }
    else el.alt = media.alt || "";
    el.onerror = () => mediaBox.classList.remove("on");
    mediaBox.appendChild(el);
  }
}

// Mouth: eased toward the mode's shape; opens with the robot's own voice (WebAudio analyser).
const mouth = {w: 44, smile: 14, open: 0};
function animate(t) {
  const target = MOUTH[$("face").dataset.mode] || MOUTH.idle;
  let open = target.open;
  if (client.playing) {
    const level = client.outputLevel();
    // No analyser (audio context not running): fall back to a simple talking motion.
    open = level > 0 || client.analyser ? Math.min(1, level * 5.5) : .3 + .25 * Math.sin(t / 70) * Math.sin(t / 190);
  }
  if (xp && xp.ctl) { xp.ctl.update(client.playProgress(), client.playSeconds()); updateCaption(); }
  if (attract.ctl) attract.ctl.update(null, (t - attract.since) / 1000);
  mouth.w += (target.w - mouth.w) * .18; mouth.smile += (target.smile - mouth.smile) * .18;
  mouth.open += (open - mouth.open) * (open > mouth.open ? .5 : .25);
  const y = 290, x1 = 200 - mouth.w, x2 = 200 + mouth.w, o = Math.max(0, mouth.open);
  $("mouth").setAttribute("d", `M${x1.toFixed(1)} ${y} Q200 ${(y + mouth.smile * 2 - o * 14).toFixed(1)} ${x2.toFixed(1)} ${y} Q200 ${(y + mouth.smile * 2 + o * 96).toFixed(1)} ${x1.toFixed(1)} ${y} Z`);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ---------- client events ----------
client.on("conn", status => {
  connected = status === "open";
  $("conn").classList.toggle("ok", connected);
  $("connText").textContent = connected ? "متصل · online" : status === "connecting" ? "جاري الاتصال…" : "غير متصل · offline";
  if (!connected) { inSession = false; serverMode = "idle"; hearing = false; }
  render();
});
client.on("hint", hint => {
  hearing = hint === "hearing";
  $("hint").textContent = hint === "speak" && !micOk ? TEXT.mic : TEXT.hints[hint] || "";
  render();
});
client.on("play", item => {
  playingTag = item.tag; clearTimeout(subtitleTimer); setSubtitle(item.text);
  if (xp) {
    if (item.segment && xp.scenes[item.segment]) showSegment(item.segment, item.text);
    else if (xp.pausePending) showPause();           // "بدك أكمل ولا عندك سؤال؟" is playing
    else exitExplainer();                            // the presentation is over: back to the conversation
  }
  render();
});
client.on("playidle", () => { playingTag = null; render(); });
client.on("message", m => {
  switch (m.type) {
    case "session.started": inSession = true; setCard(null); $("heard").textContent = ""; stopAttract(); break;
    case "session.ended": inSession = false; exitExplainer(); setChoices(null); loadScreen(); break;
    // ----- program explainer: scenes arrive before their audio; they are shown when it plays -----
    case "explainer.start": xp = {program: m.program, total: m.total, scenes: {}, pausePending: false, ctl: null, index: 0, sentences: []}; setChoices(null); break;
    case "explainer.segment": if (xp) { xp.scenes[m.index] = m.scene; xp.total = m.total; xp.pausePending = false; } break;
    case "explainer.pause": if (xp) xp.pausePending = true; break;
    case "explainer.end": if (xp) { xp.pausePending = false; if (!client.playing && client.queue.length === 0) exitExplainer(); } break;
    // ----- interest matching: tappable options, then the suggested programs -----
    case "interest.question": setChoices({options: m.options}); break;
    case "interest.result": setChoices({programs: m.programs}); break;
    case "display.update":
      serverMode = m.mode;
      if (m.speaker_label) { $("speaker").textContent = "متحدث " + m.speaker_label; $("speaker").hidden = false; }
      if (m.mode === "processing") setCard(null);
      if (m.card) setCard(m.card);
      if (m.subtitle) {
        // Subtitles follow the audio pieces; show the whole text only if no audio arrives.
        clearTimeout(subtitleTimer);
        const text = m.subtitle;
        subtitleTimer = setTimeout(() => { if (!client.playing) setSubtitle(text); }, 900);
      }
      break;
    case "transcript":
      if (m.text) setChoices(null);
      $("heard").textContent = m.text ? "«" + m.text + "»" : "";
      if (m.speaker) { $("speaker").textContent = "متحدث " + m.speaker.label; $("speaker").hidden = false; }
      break;
    case "error": console.warn("backend error", m.code, m.message); break;
  }
  render();
});

// ---------- explainer view ----------
let xp = null;   // the running presentation: {program, total, scenes{index: scene}, pausePending, ctl, index, sentences}
function showSegment(index, text) {
  const scene = xp.scenes[index];
  xp.index = index;
  $("scenePanel").classList.add("on");
  $("sceneProgram").textContent = (xp.program && xp.program.name) || "";
  $("sceneDots").replaceChildren(...Array.from({length: xp.total}, (_, i) => { const d = document.createElement("i"); d.className = i + 1 < index ? "done" : i + 1 === index ? "now" : ""; return d; }));
  xp.ctl = ExplainerScenes.render($("sceneBox"), scene, {lang: /[\u0600-\u06FF]/.test(text || "") ? "ar" : "en", words: (text || "").split(/\s+/).length});
  // running caption: the sentence being spoken, chosen by the position inside the audio
  xp.sentences = (text || "").split(/(?<=[.!?؟])\s+/).filter(Boolean);
  xp.caption = -1; updateCaption();
  for (const [id, hidden] of [["xSkip", false], ["xStop", false], ["xMore", true], ["xAsk", true]]) $(id).hidden = hidden;
}
function updateCaption() {
  if (!xp || !xp.sentences.length) return;
  const total = xp.sentences.reduce((n, s) => n + s.length, 0), at = (client.playProgress() || 0) * total;
  let i = 0, sum = 0;
  while (i < xp.sentences.length - 1 && sum + xp.sentences[i].length < at) sum += xp.sentences[i++].length;
  if (i !== xp.caption) { xp.caption = i; $("sceneCaption").textContent = xp.sentences[i]; }
}
function showPause() {
  $("sceneCaption").textContent = "";
  for (const [id, hidden] of [["xSkip", true], ["xStop", false], ["xMore", false], ["xAsk", false]]) $(id).hidden = hidden;
}
function exitExplainer() {
  xp = null;
  $("scenePanel").classList.remove("on");
  $("sceneBox").replaceChildren();
}
$("xSkip").onclick = () => client.skipCurrent();
$("xStop").onclick = () => { client.stopPlayback(); exitExplainer(); client.send({type: "explainer.stop"}); };
$("xMore").onclick = () => { client.stopPlayback(); client.send({type: "explainer.continue"}); };
$("xAsk").onclick = () => { client.stopPlayback(); exitExplainer(); };   // the microphone opens: the question ends the presentation

// ---------- idle screen: attract mode and touch buttons (approved content only) ----------
const attract = {scenes: [], i: 0, ctl: null, since: 0, timer: null};
let screenData = {programs: [], attract: [], interests: false};
async function loadScreen() {
  try {
    const r = await fetch("/api/robot/screen", {cache: "no-store"});
    if (r.ok) { screenData = await r.json(); attract.scenes = screenData.attract || []; renderChips(); render(); }
  } catch (e) { /* offline: the idle screen stays as it is */ }
}
function renderChips() {
  const box = $("chips"), items = [];
  if ((screenData.programs || []).length) { const l = document.createElement("div"); l.className = "label"; l.textContent = "اكبس على تخصص لأحكيلك عنه · Tap a program"; items.push(l); }
  for (const p of screenData.programs || []) {
    const b = document.createElement("button"); b.className = "tap"; b.textContent = p.name_ar; b.title = p.name_en;
    b.onclick = () => begin({type: "explainer.start", program: p.slug, lang: (p.langs || []).includes("ar") ? "ar" : "en"});
    items.push(b);
  }
  if (screenData.interests) {
    const b = document.createElement("button"); b.className = "tap main"; b.textContent = "ساعدني أختار 🤔"; b.title = "Help me choose";
    b.onclick = () => begin({type: "interest.start", lang: "ar"});
    items.push(b);
  }
  box.replaceChildren(...items);
}
function nextAttract() {
  if (!attract.scenes.length) return;
  const scene = attract.scenes[attract.i % attract.scenes.length];
  attract.ctl = ExplainerScenes.render($("attractScene"), scene, {words: 14});
  // a number alone says nothing: every scene that is not the title names its program
  $("attractName").textContent = scene.type === "title" ? "" : (scene.program && scene.program.name) || "";
  attract.since = performance.now(); attract.i++;
}
function startAttract() {
  if (attract.timer || !attract.scenes.length) return;
  nextAttract();
  attract.timer = setInterval(nextAttract, 7000);
}
function stopAttract() {
  clearInterval(attract.timer); attract.timer = null; attract.ctl = null;
  $("attractScene").replaceChildren(); $("attractName").textContent = "";
}
function setIdleExtras(idle) {
  const showAttract = idle && attract.scenes.length > 0;
  $("attract").classList.toggle("on", showAttract);
  document.body.classList.toggle("attract", showAttract);
  $("chips").classList.toggle("on", idle && $("chips").childElementCount > 0);
  if (showAttract) startAttract(); else stopAttract();
}
setInterval(() => { if (connected && !inSession) loadScreen(); }, 60000);   // newly approved content appears by itself

// ---------- interest matching buttons ----------
function setChoices(data) {
  const box = $("choices"), items = [];
  for (const o of (data && data.options) || []) {
    const b = document.createElement("button"); b.className = "tap" + (o.key === "none" ? " wide" : ""); b.textContent = o.label;
    b.onclick = () => { setChoices(null); client.stopPlayback(); client.send({type: "interest.choice", key: o.key}); };
    items.push(b);
  }
  for (const p of (data && data.programs) || []) {
    const b = document.createElement("button"); b.className = "tap wide" + (p.has_explainer ? " main" : ""); b.textContent = p.name + (p.has_explainer ? " ▶" : "");
    if (p.line) { const s = document.createElement("span"); s.textContent = p.line; b.appendChild(s); }
    b.disabled = !p.has_explainer;
    b.onclick = () => { setChoices(null); client.stopPlayback(); client.send({type: "explainer.start", program: p.slug}); };
    items.push(b);
  }
  box.replaceChildren(...items);
  box.classList.toggle("on", items.length > 0);
  document.body.classList.toggle("choosing", items.length > 0);
}

// ---------- controls ----------
let starting = false;
async function prepareAudio() {
  try { await client.initAudio(); micOk = true; }
  catch (e) { micOk = false; console.warn("microphone unavailable", e); }
  await client.ensureContext();
  if (cameraWanted) camera.start();
}
async function start() {
  if (inSession || !connected || starting) return;
  starting = true; stopAttract();
  try { await prepareAudio(); await client.startSession("ar"); }
  finally { setTimeout(() => { starting = false; }, 1500); }
}
// A touch button on the idle screen: it starts the conversation with that request.
async function begin(message) {
  if (!connected || starting) return;
  starting = true; stopAttract();
  try { await prepareAudio(); client.send(message); }
  finally { setTimeout(() => { starting = false; }, 1500); }
}
function toggleTyping(show) {
  const row = $("typedRow");
  row.classList.toggle("on", show === undefined ? !row.classList.contains("on") : show);
  if (row.classList.contains("on")) $("typed").focus();
}
async function sendTyped() {
  const text = $("typed").value.trim(); if (!text) return;
  $("typed").value = "";
  await client.ensureContext();
  await client.sendText(text);
}
$("start").onclick = start;
$("typedSend").onclick = sendTyped;
$("typed").addEventListener("keydown", e => { e.stopPropagation(); if (e.key === "Enter") sendTyped(); if (e.key === "Escape") toggleTyping(false); });
addEventListener("keydown", e => {
  if (e.target === $("typed") || e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.code === "Space") { e.preventDefault(); start(); }
  else if (e.code === "KeyT") { e.preventDefault(); toggleTyping(); }
  else if (e.code === "KeyC") { cameraWanted = !camera.running; camera.toggle(); }
  else if (e.code === "Escape") { if (xp) { client.stopPlayback(); exitExplainer(); } if (inSession) client.endSession("user_done"); }
  else if (e.code === "KeyF") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
});

render();
client.connect();
loadScreen();
if (params.get("face_start") === "1") camera.start();   // the camera must watch before a conversation exists
</script>
</body>
</html>
