<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>رمز الدخول — Access code</title>
<style>
  :root { --bg:#f6f4f3; --card:#fff; --ink:#231b1c; --muted:#6b6162; --line:#e3dcdb; --brand:#931b1f; --bad:#a3262a; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.6 system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:12px 16px; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:460px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=password] { width:100%; font:inherit; font-size:20px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; direction:ltr; }
  button { font:inherit; cursor:pointer; border:1px solid var(--brand); background:var(--brand); color:#fff; border-radius:8px; padding:10px 22px; font-size:18px; margin-top:14px; width:100%; }
  .muted { color:var(--muted); font-size:14px; }
  .en { direction:ltr; text-align:left; }
  .error { color:var(--bad); font-weight:600; }
</style>
</head>
<body>
<header><h1>روبوت كلية الهندسة والتصميم — جامعة الشرق الأوسط</h1></header>
<main>
  <form class="card" method="post" action="/access">
    <!--ERROR-->
    <label for="code">رمز الدخول <span class="muted">· Access code</span></label>
    <input id="code" name="code" type="password" autocomplete="off" required autofocus maxlength="200">
    <input type="hidden" name="next" value="<!--NEXT-->">
    <button type="submit">دخول · Enter</button>
    <p class="muted">اطلب الرمز من فريق المشروع. الصفحة بتحفظ دخولك لساعات قليلة على هذا الجهاز فقط.</p>
    <p class="muted en">Ask the project team for the code. This device stays signed in for a few hours.</p>
  </form>
</main>
</body>
</html>
