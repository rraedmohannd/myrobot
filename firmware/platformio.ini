; Smart Campus Robot - ESP32 firmware (docs/SPRINT_4.md R2, docs/SPRINT_5.md S1-S2). See README.md.
;
;   pio test -e native                unit tests on the build machine (no hardware, no pins)
;   pio run  -e sim-check             whole application + stub drivers, built for the build machine
;   pio run  -e esp32dev              the real firmware; does NOT compile until the pins are confirmed
;   pio run  -e esp32-compile-check   Arduino core 2.x, every pin unassigned
;   pio run  -e esp32-ci-pins         Arduino core 2.x, FAKE pins (include/pins_ci.h), compile only
;   pio run  -e esp32-ci-pins-core3   Arduino core 3.x (pioarduino), same FAKE pins, compile only
;
; No pin numbers in this file (CLAUDE.md rule 8). The robot's pins reach the firmware only through
; include/pins_generated.h, written by tools/pins_from_table.py from the pin-map table in
; docs/HARDWARE.md (fill in the table, run `python firmware/tools/pins_from_table.py`, commit
; include/pins_generated.h). -DPINS_CONFIRMED in this file is an #error.

[platformio]
default_envs = native

[env]
lib_ldf_mode = deep+
build_flags = -Wall -Wextra -I include
; SCR_GIT_HASH for DIAG_REPORT (0 when git is not available).
extra_scripts = pre:tools/git_hash.py

; ---- the real target ---------------------------------------------------------------------
[esp32_common]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 460800
build_src_filter = -<*> +<main_esp32.cpp> +<drivers_esp32/>
lib_ignore = drivers_stub
test_ignore = *
; The MCP23017 driver for HC-SR04 trigger lines on the expander (pin plan option B) exists.
esp32_flags = -DSCR_FIRMWARE_HAS_PIN_EXPANDER

[env:esp32dev]
extends = esp32_common
; Pins come from include/pins_generated.h (tools/pins_from_table.py). Without it: #error.
build_flags = ${env.build_flags} ${esp32_common.esp32_flags} -DSCR_BUILD_ENV=0

; Proves only that the Arduino-ESP32 sources compile. Pins stay unassigned; firmware built this
; way refuses to drive anything at run time and says so. Never flash it onto the robot.
[env:esp32-compile-check]
extends = esp32_common
build_flags = ${env.build_flags} ${esp32_common.esp32_flags} -DPINS_COMPILE_CHECK_ONLY -DSCR_BUILD_ENV=1

; FAKE but valid pin set (include/pins_ci.h), so the real driver code is compiled with real pin
; numbers, including the MCP23017 trigger path. COMPILE ONLY - NEVER FLASH: such a firmware boots
; into permanent SAFE, prints "CI build — not flashable" and never drives a pin.
[env:esp32-ci-pins]
extends = esp32_common
build_flags = ${env.build_flags} ${esp32_common.esp32_flags} -DSCR_CI_PINS_DO_NOT_FLASH -DSCR_BUILD_ENV=2

; The same with Arduino-ESP32 core 3.x (ESP-IDF 5: new LEDC API, pulse_cnt driver). PlatformIO's
; own espressif32 platform stops at core 2.x; core 3.x comes from the community platform
; "pioarduino" (https://github.com/pioarduino/platform-espressif32), release 55.03.312-1
; (2026-09-22). Needs PlatformIO Core >= 6.1.19 (the Docker image has 6.2.0). COMPILE ONLY.
[env:esp32-ci-pins-core3]
extends = esp32_common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
build_flags = ${env.build_flags} ${esp32_common.esp32_flags} -DSCR_CI_PINS_DO_NOT_FLASH -DSCR_BUILD_ENV=2

; ---- off-target ----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
; Fixture directory of the Python <-> C++ cross-test, relative to this directory
; (override at run time with the environment variable SCR_FIXTURE_DIR).
build_flags = ${env.build_flags} -DSCR_FIXTURE_DIR=../shared/serial_fixtures

[env:sim-check]
platform = native
build_src_filter = -<*> +<main_sim.cpp>
test_ignore = *
