# CI of the Smart Campus Robot (docs/SPRINT_5.md S9, docs/CI.md).
# Tests only: nothing is built for release, deployed or flashed. No secret is needed: the backend
# tests use fake STT/LLM/TTS/embedding providers, never OpenAI.
name: CI

on:
  push:
    branches: ["sprint-*", "release"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest + Postgres/pgvector)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: robot
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: smart_campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robot -d smart_campus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # Same layout as backend/Dockerfile (PYTHONPATH=/app:/shared), relative to backend/.
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}/shared
      DATABASE_URL: postgresql+asyncpg://robot:ci-only-not-a-secret@localhost:5432/smart_campus
      APP_ENV: test
      # No speaker model in CI: the tests use FakeSpeakerEmbedder; the app logs
      # "speaker model not found" and disables voice speaker tracking (docs/SPEAKERS.md).
      SPEAKER_MODEL_PATH: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        run: pip install ".[dev,report]"
      - name: Migrate the database
        run: alembic upgrade head
      # Some tests (test_curated, test_places, test_resilience, ...) expect what the laptop's
      # database holds: the curated knowledge of backend/data/knowledge/ imported and reviewed.
      # In this throw-away CI database it is imported and marked approved WITHOUT a human review
      # (CI ONLY; on the real database Mohannd reviews every source in the admin page).
      - name: Test data (import curated knowledge, approve it in the CI database only)
        run: |
          python -m app.ingestion.cli import-knowledge
          python - <<'EOF'
          import asyncio, os
          import asyncpg

          async def main() -> None:
              url = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://")
              conn = await asyncpg.connect(url)
              for table in ("sources", "chunks"):
                  print(table, await conn.execute(
                      f"UPDATE {table} SET review_status = 'approved' WHERE review_status = 'pending'"
                  ))
              await conn.close()

          asyncio.run(main())
          EOF
      - name: pytest
        run: pytest -q
      - name: JS speaker logic test
        working-directory: .
        run: node backend/tests/js/speaker_logic_test.mjs

  shellcheck:
    name: shellcheck (shell scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Every tracked *.sh, with the same pinned shellcheck as on the laptop (docs/SPRINT_6.md P0.4).
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          printf '%s\n' "${files[@]}"
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -x "${files[@]}"

  robot:
    name: robot + firmware tools (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.12: with OpenCV (headless) and the YuNet model, so the visiond camera/detector
          # tests on synthetic pictures run instead of being skipped.
          - python: "3.12"
            vision: true
          # 3.13: the Python of Raspberry Pi OS trixie; without the vision packages.
          - python: "3.13"
            vision: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            robot/pyproject.toml
            shared/pyproject.toml
      # robotd's local UI JavaScript is tested from pytest through Node (skipped without node).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install shared + robot[dev]
        run: pip install ./shared "./robot[dev]"
      - name: Install OpenCV (headless) + numpy
        if: matrix.vision
        run: pip install "numpy>=1.26,<3" "opencv-python-headless>=4.10,<6"
      - name: Cache the YuNet model
        if: matrix.vision
        uses: actions/cache@v4
        with:
          path: robot/models/face_detection_yunet_2023mar.onnx
          key: yunet-2023mar
      - name: Download the YuNet model
        if: matrix.vision
        run: python robot/models/download_models.py --yunet
      - name: pytest robot/
        working-directory: robot
        run: pytest -q
      - name: pytest firmware/tools/tests
        run: pytest -q firmware/tools/tests

  firmware:
    name: firmware (native tests, sim-check, compile checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-6.2.0-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-6.2.0-
      # Same version as firmware/tools/Dockerfile (the pioarduino core-3 env needs >= 6.1.19);
      # intelhex: needed by the esptool the pioarduino platform brings.
      - name: Install PlatformIO
        run: pip install "platformio==6.2.0" intelhex
      - name: Native unit tests (+ Python <-> C++ protocol cross-test)
        run: pio test -e native
      - name: sim-check (whole application with stub drivers, run; SIMULATED)
        run: pio run -e sim-check -t exec
      - name: Compile check, Arduino core 2.x, pins unassigned
        run: pio run -e esp32-compile-check
      - name: Compile check, Arduino core 2.x, FAKE CI pins (never flashed)
        run: pio run -e esp32-ci-pins
      - name: Compile check, Arduino core 3.x (pioarduino), FAKE CI pins (never flashed)
        run: pio run -e esp32-ci-pins-core3
      - name: The real firmware (esp32dev) refuses to build without confirmed pins
        run: |
          if [ -f include/pins_generated.h ]; then
            echo "include/pins_generated.h exists: esp32dev must build."
            pio run -e esp32dev
            exit 0
          fi
          if pio run -e esp32dev > esp32dev.log 2>&1; then
            cat esp32dev.log
            echo "::error::esp32dev built without include/pins_generated.h (the pins #error is missing)"
            exit 1
          fi
          if ! grep -q "Pins are not confirmed" esp32dev.log; then
            cat esp32dev.log
            echo "::error::esp32dev failed, but not with the 'Pins are not confirmed' #error"
            exit 1
          fi
          echo "OK: esp32dev stops with the 'Pins are not confirmed' #error, as it should."
