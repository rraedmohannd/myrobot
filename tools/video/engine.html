<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Program video renderer</title>
<style>
@font-face { font-family: "Cairo"; src: url("fonts/cairo-arabic.woff2") format("woff2"); font-weight: 200 1000; }
@font-face { font-family: "Outfit"; src: url("fonts/Outfit-Regular.ttf"); font-weight: 400; }
@font-face { font-family: "Outfit"; src: url("fonts/Outfit-Bold.ttf"); font-weight: 700; }
:root {
  --ink: #F5F1E8; --muted: rgba(245,241,232,.62); --red: #D6453F; --red-deep: #8E1B1B; --gold: #F2C14E;
  --glass: rgba(255,255,255,.045); --line: rgba(214,69,63,.55);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0A1020; }
body { font-family: "Cairo", "Outfit", sans-serif; color: var(--ink); position: relative; }
#stage { position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(1400px 900px at 70% 20%, #16213D 0%, #0E1528 55%, #090E1C 100%); }
#dots { position: absolute; inset: -60px; background-image: radial-gradient(rgba(245,241,232,.09) 1.6px, transparent 1.8px);
  background-size: 46px 46px; }
.blob { position: absolute; border-radius: 50%; filter: blur(30px); }
#circuit { position: absolute; inset: 0; }
.en { font-family: "Outfit"; direction: ltr; }
.scene { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
.heading { position: absolute; top: 150px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 76px; line-height: 1.2; }
.heading .bar { display: block; width: 120px; height: 6px; border-radius: 3px; margin: 14px auto 0;
  background: linear-gradient(90deg, var(--gold), var(--red)); }
.note { display: inline-block; font-size: 28px; font-weight: 600; color: var(--gold); border: 2px solid rgba(242,193,78,.5);
  border-radius: 40px; padding: 2px 22px; margin-inline-start: 22px; vertical-align: middle; }
.enline { position: absolute; left: 0; right: 0; top: 842px; text-align: center; font-size: 27px; color: rgba(245,241,232,.5); letter-spacing: .5px; }
.card { position: absolute; background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
  border: 2px solid var(--line); border-radius: 30px;
  box-shadow: 0 0 0 1px rgba(255,255,255,.03) inset, 0 18px 50px rgba(0,0,0,.35), 0 0 40px rgba(214,69,63,.16); }
.card.hot { border-color: var(--gold); box-shadow: 0 0 0 1px rgba(255,255,255,.04) inset, 0 18px 50px rgba(0,0,0,.35), 0 0 46px rgba(242,193,78,.28); }
.ico { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.icowrap { position: absolute; border-radius: 50%; display: grid; place-items: center; color: var(--gold);
  background: radial-gradient(circle at 35% 30%, rgba(242,193,78,.22), rgba(214,69,63,.18)); border: 2px solid rgba(242,193,78,.45); }
.icowrap svg { width: 58%; height: 58%; }
.gold { color: var(--gold); }
b, .num { font-family: "Outfit"; font-weight: 700; color: var(--gold); }
/* header */
#header { position: absolute; top: 0; left: 0; right: 0; height: 120px; opacity: 0; }
#header .txt { position: absolute; right: 90px; top: 42px; font-size: 30px; font-weight: 600; color: var(--muted); }
#header .txt i { font-style: normal; color: var(--gold); }
#miniface { position: absolute; left: 80px; top: 26px; width: 96px; height: 96px; }
#progress { position: absolute; top: 0; right: 0; height: 7px; background: linear-gradient(270deg, var(--gold), var(--red));
  box-shadow: 0 0 18px rgba(242,193,78,.6); border-radius: 0 0 0 4px; }
/* caption */
#caption { position: absolute; bottom: 58px; left: 50%; transform: translateX(-50%); max-width: 1640px; white-space: nowrap;
  font-size: 46px; font-weight: 700; padding: 14px 44px 18px; border-radius: 22px; background: rgba(6,10,22,.78);
  border: 2px solid rgba(214,69,63,.6); box-shadow: 0 0 34px rgba(214,69,63,.25); opacity: 0; }
#caption b { font-size: 48px; }
/* bubbles */
.bubble { position: absolute; font-size: 54px; font-weight: 700; line-height: 1.45; padding: 30px 46px; border-radius: 34px; }
.bubble.visitor { background: rgba(245,241,232,.95); color: #141B2E; }
.bubble.robot { background: linear-gradient(160deg, rgba(214,69,63,.95), rgba(142,27,27,.95)); color: #fff; box-shadow: 0 0 50px rgba(214,69,63,.45); }
.bubble .w { opacity: 0; }
.tail { position: absolute; width: 0; height: 0; }
.donut-legend .row { position: absolute; right: 0; width: 760px; height: 104px; display: flex; align-items: center; gap: 26px; padding: 0 34px; }
.dot { width: 30px; height: 30px; border-radius: 50%; flex: none; box-shadow: 0 0 16px currentColor; }
.lbl { font-size: 46px; font-weight: 700; flex: 1; }
.val { font-family: "Outfit"; font-weight: 700; font-size: 64px; color: var(--gold); min-width: 110px; text-align: left; }
</style>
</head>

function spinAll(root, t) { root.querySelectorAll('.spin').forEach((g) => g.setAttribute('transform', `rotate(${(t * 55) % 360} ${g.dataset.cx} ${g.dataset.cy})`)); }
function drawingSVG(name, cls = '') {

// ---------- robot face ----------
function faceSVG() {
  return `<defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2B4D"/><stop offset="1" stop-color="#0E1730"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#fg)" stroke="#D6453F" stroke-width="6" filter="url(#glow)"/>
    <g filter="url(#glow)"><ellipse class="eyeL" cx="68" cy="84" rx="15" ry="17" fill="#FFF8E8"/><ellipse class="eyeR" cx="132" cy="84" rx="15" ry="17" fill="#FFF8E8"/>
    <path class="mouth" d="" fill="#F2C14E" stroke="#F2C14E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>`;
}
function setFace(svg, t, talk, wink = 0) {
  const blinkPhase = (t % 3.9);
  const blink = blinkPhase < 0.14 ? Math.sin(blinkPhase / 0.14 * Math.PI) : 0;
  const sL = 1 - 0.9 * blink, sR = 1 - 0.9 * Math.max(blink, wink);
  const eL = svg.querySelector('.eyeL'), eR = svg.querySelector('.eyeR');
  eL.setAttribute('ry', 17 * sL); eR.setAttribute('ry', 17 * sR);
  const o = Math.max(0, Math.min(1, talk));
  const top = 132, l = 64, r = 136, curve = 12;
  const d = `M${l},${top} Q100,${top + curve} ${r},${top} Q100,${top + curve + 4 + o * 34} ${l},${top} Z`;
  svg.querySelector('.mouth').setAttribute('d', d);
}

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const prog = (t, a, d) => clamp((t - a) / d);
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeInOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const backOut = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function fit(node, maxW, minSize = 20) {
  let fs = parseFloat(getComputedStyle(node).fontSize);
  let span = node.querySelector(':scope > .fitspan');
  if (!span) { span = document.createElement('span'); span.className = 'fitspan'; span.innerHTML = node.innerHTML; node.innerHTML = ''; node.appendChild(span); }
  span.style.display = 'inline-block'; span.style.whiteSpace = 'nowrap';
  let guard = 0;
  while (span.offsetWidth > maxW && fs > minSize && guard++ < 200) { fs -= 2; node.style.fontSize = fs + 'px'; }
}
const fmt = (v) => String(Math.round(v));

let TL, SC = [];

function build(tl) {
  TL = tl;
  document.querySelector('#header .txt').innerHTML = tl.header.replace('·', '<i>·</i>');
  document.getElementById('miniface').innerHTML = faceSVG();
  // circuit traces
  const traces = ['M0 210 H160 L220 270 H420', 'M1920 160 H1760 L1700 220 H1540', 'M0 900 H120 L180 840 H330', 'M1920 930 H1800 L1740 990 H1600', 'M60 0 V90 L120 150', 'M1860 1080 V990 L1800 930'];
  document.getElementById('circuit').innerHTML = traces.map((d, i) =>
    `<path d="${d}" fill="none" stroke="rgba(214,69,63,.28)" stroke-width="2.5"/>` +
    `<path class="pulse" data-i="${i}" d="${d}" pathLength="100" fill="none" stroke="#F2C14E" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="7 93" style="filter:drop-shadow(0 0 6px #F2C14E)"/>`).join('');
  const root = document.getElementById('scenes');
  tl.scenes.forEach((s, i) => { const node = BUILDERS[s.type](s, tl); node.dataset.i = i; root.appendChild(node); s.node = node; SC.push(s); });
}

const BUILDERS = {
  intro(s) {
    const words = s.visitor.split(' ').map((w) => `<span class="w">${w}</span>`).join(' ');
    const n = el(`<section class="scene">
      <div class="icowrap" style="right:150px;top:200px;width:120px;height:120px;color:#F5F1E8">${icon('person')}</div>
      <div class="vlabel" style="position:absolute;right:120px;top:330px;width:180px;text-align:center;font-size:30px;font-weight:700;color:var(--muted)">زائر</div>
      <div class="bubble visitor" style="right:320px;top:170px;max-width:1150px">${words}</div>
      <svg class="face" viewBox="0 0 200 200" style="position:absolute;left:260px;top:430px;width:400px;height:400px;overflow:visible">${faceSVG()}</svg>
      <div class="bubble robot" style="left:720px;top:560px;max-width:900px;white-space:nowrap"></div>
    </section>`);
    return n;
  },
  title(s, tl) {
    return el(`<section class="scene">
      <div class="ttl" style="position:absolute;left:0;right:0;top:175px;text-align:center;font-size:150px;font-weight:900;line-height:1.25;text-shadow:0 0 40px rgba(214,69,63,.55)">${tl.title_ar}</div>
      <div class="en ttlen" style="position:absolute;left:0;right:0;top:395px;text-align:center;font-size:50px;font-weight:700;color:var(--gold);letter-spacing:3px">${tl.title_en}</div>
      <div class="draw" style="position:absolute;left:510px;top:470px;width:900px;height:330px">${drawingSVG(tl.drawing)}</div>
      <div class="enline en">${s.en}</div>
    </section>`);
  },
  stats(s) {
    const W = 500, H = 400, gap = 60, total = s.cards.length * W + (s.cards.length - 1) * gap, x0 = (1920 - total) / 2;
    return el(`<section class="scene">
      <div class="heading">${s.heading}<span class="bar"></span></div>
      ${s.cards.map((c, i) => `<div class="card item" data-cue="${c.cue}" style="right:${x0 + i * (W + gap)}px;top:330px;width:${W}px;height:${H}px">
          <div class="big ${c.text ? '' : 'num'}" data-value="${c.value ?? ''}" style="position:absolute;left:30px;right:30px;top:${c.text ? 70 : 40}px;text-align:center;font-size:${c.text ? 104 : 160}px;font-weight:900;color:var(--gold);line-height:1.25">${c.text ?? '0'}</div>
          <div class="${c.text ? 'en' : ''}" style="position:absolute;left:24px;right:24px;bottom:34px;height:112px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:40px;font-weight:700;line-height:1.3">${c.label}</div>
        </div>`).join('')}
      <div class="enline en">${s.en}</div>
    </section>`);
  },
  donut(s) {
    const R = 210, C = 2 * Math.PI * R; let acc = 0;
    const arcs = s.parts.map((p, i) => { const len = p.value / s.total * C; const a = `<circle class="arc" data-cue="${p.cue}" data-len="${len}" data-off="${acc}" cx="0" cy="0" r="${R}" fill="none" stroke="${p.color}" stroke-width="78" stroke-dasharray="0 ${C}" transform="rotate(-90)" style="filter:drop-shadow(0 0 10px ${p.color}66)"/>`; acc += len; return a; }).join('');
    return el(`<section class="scene">
      <div class="heading">${s.heading}<span class="bar"></span></div>
      <svg style="position:absolute;left:250px;top:300px;width:560px;height:560px;overflow:visible" viewBox="-280 -280 560 560">
        <circle r="${R}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="78"/>${arcs}</svg>
      <div style="position:absolute;left:250px;top:300px;width:560px;height:560px;display:grid;place-items:center;text-align:center">

  rows(s) {

  grid(s) {

      ${s.items.map((c, i) => { const col = i % cols, row = Math.floor(i / cols); return `<div class="card item" data-cue="${c.cue}" style="right:${x0 + col * (W + gx)}px;top:${330 + row * (H + gy)}px;width:${W}px;height:${H}px">
        <div class="icowrap" style="right:24px;top:${(H - 96) / 2}px;width:96px;height:96px">${icon(c.icon)}</div>
        <div class="t" style="position:absolute;right:140px;left:22px;top:0;bottom:0;display:flex;align-items:center;font-size:${cols === 2 ? 50 : 42}px;font-weight:800;line-height:1.3">${c.text}</div></div>`; }).join('')}
      ${s.footer ? `<div class="item foot" data-cue="${s.footer.cue}" style="position:absolute;left:0;right:0;top:722px;text-align:center;font-size:58px;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(242,193,78,.4)">
        <span style="display:inline-block;width:70px;height:70px;vertical-align:middle;margin-inline-end:18px">${icon(s.footer.icon)}</span>${s.footer.text}</div>` : ''}
      <div class="enline en">${s.en}</div>
    </section>`);
  },
  badges(s) {
    return el(`<section class="scene">
      <div class="heading">${s.heading}${s.note ? `<span class="note">${s.note}</span>` : ''}<span class="bar"></span></div>
      ${s.badges.map((c, i) => `<div class="card item" data-cue="${c.cue}" style="right:250px;left:250px;top:${320 + i * 150}px;height:126px">
        <div class="icowrap" style="right:22px;top:15px;width:96px;height:96px">${icon(c.icon)}</div>
        <div class="t" style="position:absolute;right:146px;left:30px;top:0;bottom:0;display:flex;align-items:center;font-size:50px;font-weight:800">${c.text}</div></div>`).join('')}
      ${s.items.map((c, i) => `<div class="item line" data-cue="${c.cue}" style="position:absolute;right:300px;left:300px;top:${640 + i * 86}px;height:76px;display:flex;align-items:center;gap:22px;font-size:44px;font-weight:700">
        <span style="width:58px;height:58px;color:var(--gold);flex:none">${icon(c.icon)}</span><span class="t">${c.text}</span></div>`).join('')}
      <div class="enline en">${s.en}</div>
    </section>`);
  },
  studio(s) {
    const st = s.studio, W = 760, H = 118, gx = 50, gy = 22, x0 = (1920 - (2 * W + gx)) / 2;
    const sq = Array.from({ length: st.count }, (_, i) => `<div class="sq" style="width:74px;height:74px;border-radius:14px;border:3px solid rgba(242,193,78,.6)"></div>`).join('');
    return el(`<section class="scene">
      <div class="heading">${s.heading}<span class="bar"></span></div>
      <div class="card item" data-cue="${st.cue}" style="right:${x0}px;left:${x0}px;top:290px;height:206px">
        <div style="position:absolute;right:44px;top:26px;font-size:60px;font-weight:900">${st.big.replace(/^(\d+)/, '<b style="font-size:72px">$1</b>')}</div>
        <div class="item sub" data-cue="${st.subcue}" style="position:absolute;right:46px;top:118px;font-size:42px;font-weight:700;color:var(--muted)">${st.sub}</div>
        <div class="sqs" style="position:absolute;left:44px;top:66px;display:flex;gap:16px;direction:ltr">${sq}</div>
      </div>
      ${s.items.map((c, i) => { const col = i % 2, row = Math.floor(i / 2); return `<div class="card item chip" data-cue="${c.cue}" style="right:${x0 + col * (W + gx)}px;top:${520 + row * (H + gy)}px;width:${W}px;height:${H}px">
        <div class="icowrap" style="right:22px;top:${(H - 90) / 2}px;width:90px;height:90px">${icon(c.icon)}</div>
        <div class="t" style="position:absolute;right:136px;left:24px;top:0;bottom:0;display:flex;align-items:center;font-size:46px;font-weight:800">${c.text}</div></div>`; }).join('')}
      <div class="enline en">${s.en}</div>
    </section>`);
  },
  quote(s) {
    return el(`<section class="scene">
      <div class="en" style="position:absolute;left:0;right:0;top:140px;text-align:center;font-size:200px;line-height:1;color:var(--gold);opacity:.85;text-shadow:0 0 40px rgba(242,193,78,.5)">&ldquo;</div>
      ${s.lines.map(([txt, cue], i) => `<div class="qline" data-cue="${cue}" style="position:absolute;left:0;right:0;top:${410 + i * 165}px;text-align:center;font-size:${i === 0 ? 96 : 120}px;font-weight:900;color:${i === 0 ? 'var(--ink)' : 'var(--gold)'};text-shadow:0 0 36px ${i === 0 ? 'rgba(214,69,63,.45)' : 'rgba(242,193,78,.45)'}">${txt.split(' ').map((w) => `<span class="w">${w}</span>`).join(' ')}</div>`).join('')}
      ${s.note ? `<div style="position:absolute;left:0;right:0;top:340px;text-align:center"><span class="note" style="margin:0">${s.note}</span></div>` : ''}
      <div class="enline en">${s.en}</div>
    </section>`);
  },
  closing(s, tl) {
    return el(`<section class="scene">
      <div class="bgdraw" style="position:absolute;left:510px;top:420px;width:900px;height:330px;opacity:.13">${drawingSVG(tl.drawing)}</div>
      <div class="big" style="position:absolute;left:0;right:0;top:230px;text-align:center;font-size:150px;font-weight:900;line-height:1.25;text-shadow:0 0 50px rgba(242,193,78,.45),0 0 18px rgba(214,69,63,.6)">${s.big}</div>
      ${s.lines.map(([txt, cue], i) => `<div class="item line" data-cue="${cue}" style="position:absolute;left:0;right:0;top:${490 + i * 90}px;text-align:center;font-size:${i === 0 ? 54 : 44}px;font-weight:${i === 0 ? 800 : 600};color:${i === 0 ? 'var(--ink)' : 'var(--muted)'}">${txt}</div>`).join('')}
      <div class="item src" data-cue="${s.lines.length}" style="position:absolute;left:0;right:0;top:800px;text-align:center;font-size:28px;color:rgba(245,241,232,.45)">${s.source}</div>
    </section>`);
  },
  outro(s) {
    return el(`<section class="scene">
      <svg class="face" viewBox="0 0 200 200" style="position:absolute;left:760px;top:220px;width:400px;height:400px;overflow:visible">${faceSVG()}</svg>
      <div style="position:absolute;left:0;right:0;top:690px;text-align:center;font-size:92px;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(242,193,78,.4)">${s.text}</div>
    </section>`);
  }
};

function afterFonts() {
  document.querySelectorAll('.scene').forEach((sc) => { sc.style.opacity = 1; sc.style.visibility = 'visible'; });
  document.querySelectorAll('.ttl').forEach((n) => fit(n, 1700));
  document.querySelectorAll('.big:not(.num)').forEach((n) => { if (n.closest('.card')) fit(n, 430, 40); else fit(n, 1760); });
  document.querySelectorAll('.card .t').forEach((n) => {
    const one = !!n.closest('.chip') || !!n.closest('.row');
    let fs = parseFloat(getComputedStyle(n).fontSize);
    const inner = document.createElement('div'); inner.innerHTML = n.innerHTML; n.innerHTML = ''; n.appendChild(inner);
    inner.style.whiteSpace = one ? 'nowrap' : 'normal'; inner.style.width = '100%';
    const maxH = n.clientHeight - 12;
    const fits = () => inner.scrollWidth <= n.clientWidth + 1 && inner.offsetHeight <= maxH;
    let guard = 0; while (!fits() && fs > 24 && guard++ < 80) { fs -= 2; n.style.fontSize = fs + 'px'; }
  });
  document.querySelectorAll('.line .t').forEach((n) => fit(n, Math.max(400, n.parentElement.clientWidth - 90), 24));
  document.querySelectorAll('.scene').forEach((sc) => { sc.style.opacity = 0; });
}

// ---------- per-frame state ----------
function curChunk(s, t) { let k = -1; s.chunk_times.forEach((ct, i) => { if (t >= ct) k = i; }); return k; }
function envAt(t) { const f = Math.floor(t * TL.fps); return TL.env[f] || 0; }

function setTime(t) {
  // background motion
  document.getElementById('dots').style.transform = `translate(${(t * 7) % 46}px, ${(t * 3.5) % 46}px)`;
  const b = (id, x, y) => { document.getElementById(id).style.transform = `translate(${x}px, ${y}px)`; };
  b('b1', 1150 + 160 * Math.sin(t * 0.13), -350 + 120 * Math.cos(t * 0.11));
  b('b2', -250 + 140 * Math.cos(t * 0.09), 520 + 110 * Math.sin(t * 0.12));
  b('b3', -500 + 120 * Math.sin(t * 0.07), -500 + 90 * Math.sin(t * 0.1));
  document.querySelectorAll('#circuit .pulse').forEach((p, i) => p.setAttribute('stroke-dashoffset', -((t * 18 + i * 37) % 100)));
  document.getElementById('progress').style.width = (1920 * clamp(t / TL.total)) + 'px';

  const talk = envAt(t);
  let capText = '', capOp = 0, headerOp = 0;
  SC.forEach((s, i) => {
    const n = s.node;
    const enterD = 0.7, exitD = 0.45;
    let op = 0, ty = 0, sc = 1;
    if (t >= s.start - 0.01 && t <= s.end + exitD) {
      const pin = easeOut(prog(t, s.start, enterD));
      const pout = prog(t, s.end, exitD);
      op = pin * (1 - pout); ty = (1 - pin) * 36; sc = 1 - 0.03 * pout;
      if (s.type === 'intro') { op = (t < s.end) ? 1 : 1 - pout; ty = 0; }
    }
    n.style.opacity = op; n.style.transform = `translateY(${ty}px) scale(${sc})`;
    n.style.visibility = op > 0.001 ? 'visible' : 'hidden';
    if (op <= 0.001) return;
    const lt = t - s.start; const k = curChunk(s, t);
    // generic items with cues
    n.querySelectorAll('.item').forEach((it) => {
      const cue = +it.dataset.cue; const ct = cue < s.chunk_times.length ? s.chunk_times[cue] : s.audio_end - 0.6;
      const order = [...it.parentElement.children].filter((x) => x.dataset && x.dataset.cue == it.dataset.cue).indexOf(it);
      const p = prog(t, ct - 0.15 + order * 0.18, 0.55);
      const e = backOut(p);
      it.style.opacity = clamp(p * 1.6);
      if (it.classList.contains('row') || it.classList.contains('line')) it.style.transform = `translateX(${(1 - easeOut(p)) * -80}px)`;
      else it.style.transform = `translateY(${(1 - easeOut(p)) * 40}px) scale(${0.86 + 0.14 * e})`;
      if (it.classList.contains('card')) it.classList.toggle('hot', p >= 1 && k === cue && t < s.audio_end);
    });
    if (s.type !== 'intro' && s.type !== 'outro') headerOp = Math.max(headerOp, op);
    // captions
    if (s.type !== 'intro' && s.type !== 'outro' && k >= 0 && t <= s.audio_end + 0.35) {
      capText = s.chunks[k][1]; capOp = Math.min(op, prog(t, s.chunk_times[k], 0.18)) * (1 - prog(t, s.audio_end + 0.15, 0.2));
    }
    // type-specific
    if (s.type === 'intro') {
      const words = n.querySelectorAll('.bubble.visitor .w');
      words.forEach((w, j) => { w.style.opacity = prog(t, 0.35 + j * (1.5 / words.length), 0.18); });
      const vb = n.querySelector('.bubble.visitor'); const pv = easeOut(prog(t, 0.15, 0.35));
      vb.style.opacity = pv; vb.style.transform = `scale(${0.9 + 0.1 * pv})`;
      n.querySelector('.icowrap').style.opacity = pv;
      const face = n.querySelector('.face');
      const pf = backOut(prog(t, 0.1, 0.6));
      const wink = (t > s.audio_end - 0.1 && t < s.audio_end + 0.35) ? Math.sin(prog(t, s.audio_end - 0.1, 0.45) * Math.PI) : 0;
      setFace(face, t, t >= s.audio_start ? talk : 0, wink);
      const pz = easeInOut(prog(t, s.end - 0.55, 0.9));
      face.style.transform = `translate(${pz * 440}px, ${-pz * 120}px) scale(${pf * (1 + pz * 4)})`;
      face.style.opacity = 1 - pz;
      const rb = n.querySelector('.bubble.robot');
      if (k >= 0) { rb.textContent = s.chunks.slice(0, k + 1).map((c) => c[1]).join(' '); }
      const pr = easeOut(prog(t, s.audio_start - 0.1, 0.35));
      rb.style.opacity = pr * (1 - pz); rb.style.transform = `scale(${0.9 + 0.1 * pr})`;
      vb.style.opacity = pv * (1 - pz); n.querySelector('.icowrap').style.opacity = pv * (1 - pz); n.querySelector('.vlabel').style.opacity = pv * (1 - pz);
    }
    if (s.type === 'title') {
      const items = n.querySelectorAll('.draw [data-i]'); const N = items.length;
      const pd = prog(t, s.start + 0.5, 4.2);
      items.forEach((p, j) => { const a = j / N * 0.75; const q = clamp((pd - a) / 0.25); p.style.strokeDasharray = '1 1'; p.style.strokeDashoffset = 1 - q; });
      const pt = easeOut(prog(t, s.start + 0.1, 0.8));
      n.querySelector('.ttl').style.transform = `scale(${0.92 + 0.08 * pt})`;
      n.querySelector('.ttlen').style.opacity = prog(t, s.start + 0.6, 0.6);
      n.querySelector('.draw').style.transform = `translateY(${Math.sin(t * 1.2) * 6}px)`;
      spinAll(n, t);
    }
    if (s.type === 'stats') {
      n.querySelectorAll('.big.num').forEach((d) => { const card = d.closest('.card'); const cue = +card.dataset.cue;
        const p = easeOut(prog(t, s.chunk_times[cue] + 0.1, 1.3)); d.textContent = fmt(+d.dataset.value * p); });
    }
    if (s.type === 'donut') {
      let shown = 0;
      n.querySelectorAll('.arc').forEach((a, j) => { const cue = +a.dataset.cue; const sameBefore = [...n.querySelectorAll('.arc')].slice(0, j).filter((x) => x.dataset.cue == a.dataset.cue).length;
        const p = easeInOut(prog(t, s.chunk_times[cue] + sameBefore * 0.35, 0.8)); const len = +a.dataset.len, off = +a.dataset.off;
        a.setAttribute('stroke-dasharray', `${Math.max(0.001, len * p - 3)} 99999`); a.setAttribute('stroke-dashoffset', -off); a.style.opacity = p > 0.01 ? 1 : 0;
        shown += s.parts[j].value * p; });
      n.querySelector('.total').textContent = fmt(shown);
    }
    if (s.type === 'studio') {
      const c0 = s.chunk_times[s.studio.cue];
      n.querySelectorAll('.sq').forEach((q, j) => { const p = prog(t, c0 + 0.25 + j * 0.28, 0.3);
        q.style.background = `rgba(242,193,78,${0.85 * p})`; q.style.boxShadow = `0 0 ${24 * p}px rgba(242,193,78,${0.7 * p})`; q.style.transform = `scale(${0.8 + 0.2 * backOut(p)})`; });
    }
    if (s.type === 'quote') {
      n.querySelectorAll('.qline').forEach((ql) => { const ct = s.chunk_times[+ql.dataset.cue]; const ws = ql.querySelectorAll('.w');
        ws.forEach((w, j) => { const p = prog(t, ct + j * 0.32, 0.3); w.style.opacity = p; w.style.display = 'inline-block'; w.style.transform = `translateY(${(1 - easeOut(p)) * 30}px)`; }); });
    }
    if (s.type === 'closing') {
      const pb = easeOut(prog(t, s.start + 0.2, 0.9));
      const big = n.querySelector('.big'); big.style.transform = `scale(${0.85 + 0.15 * pb})`; big.style.opacity = pb;
      const items = n.querySelectorAll('.bgdraw [data-i]'); items.forEach((p) => { p.style.strokeDasharray = '1 1'; p.style.strokeDashoffset = 1 - prog(t, s.start, 3); }); spinAll(n, t);
    }
    if (s.type === 'outro') {
      const face = n.querySelector('.face'); const p = easeOut(prog(t, s.start, 0.9));
      face.style.transform = `scale(${3.2 - 2.2 * p})`; face.style.opacity = p;
      setFace(face, t, t >= s.audio_start ? talk : 0, 0);
    }
  });
  const hdr = document.getElementById('header'); hdr.style.opacity = headerOp;
  setFace(document.getElementById('miniface'), t, talk, 0);
  const cap = document.getElementById('caption');
  if (cap.dataset.text !== capText) { cap.innerHTML = capText.replace(/(\d+(?:\/\d+)?)/g, '<b>$1</b>'); cap.dataset.text = capText;
    cap.style.fontSize = '46px'; if (cap.scrollWidth > 1740) cap.style.fontSize = Math.floor(46 * 1740 / cap.scrollWidth) + 'px'; }
  cap.style.opacity = capOp;
}

window.init = async (tl) => { build(tl); await document.fonts.ready; await new Promise((r) => setTimeout(r, 50)); afterFonts(); setTime(0); return { total: tl.total, frames: tl.env.length }; };
window.setTime = setTime;
</script>
</body>
